name: Airbnb live check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test response decoding
        run: python -m unittest discover -s tests -v
      - name: Check live Airbnb calendars, details, and pricing
        run: python scripts/check_airbnb.py
