name: Mt Hood Market Scrape

# Two triggers:
#   - Daily collection (every run): pulls calendars/details/pricing for known listings.
#   - Weekly discovery (Mondays): also re-searches Airbnb to find NEW listings.
# The weekly Monday run does BOTH discovery and collection; the daily runs only collect.
on:
  workflow_dispatch:
    inputs:
      run_discovery:
        description: "Force a discovery pass on this manual run"
        type: boolean
        default: false
      allow_fresh_start:
        description: "DANGER: allow starting from an EMPTY database if no saved DB can be restored"
        type: boolean
        default: false
  schedule:
    - cron: '23 14 * * *'    # Daily collection — 14:23 UTC = 7:23 AM PDT
    - cron: '23 16 * * 1'    # Weekly discovery — Mondays 16:23 UTC = 9:23 AM PDT

permissions:
  contents: read
  pages: write        # deploy the market dashboard to GitHub Pages
  id-token: write     # required by actions/deploy-pages

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Never let two runs overlap: both would restore db-latest, both would scrape,
    # and whichever uploaded LAST would silently erase the other's day of data.
    # A manual dispatch that lands during the scheduled run now waits its turn.
    concurrency:
      group: market-scrape
      cancel-in-progress: false
    timeout-minutes: 360   # GitHub-hosted max; Vacasa step added 2026-09-08
    # Publishes the market dashboard to GitHub Pages at the end of the run. This
    # replaces the fragile Mac-based site refresh (580MB download + Vercel upload
    # over a home connection kept failing). Everything runs in the cloud now.
    environment:
      name: github-pages
      url: ${{ steps.pages_deploy.outputs.page_url }}

    steps:
      - name: Checkout scraper repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ──────────────────────────────────────────────────────────────────
      # Restore the database from the PRIVATE data repo.
      # The DB is ~3 GB raw / ~370 MB gzipped — far over GitHub's 100 MB file
      # limit — so it is NOT committed. It is stored as a RELEASE ASSET on a
      # separate PRIVATE repo (release assets allow up to 2 GB and stay private
      # on a private repo) and pulled in here via the gh CLI using a PAT secret.
      # TODO: create private repo `loganmount1/str-tracker-data`, a fine-grained
      #       PAT with Contents:read+write on it, and add it as secret DATA_REPO_PAT.
      # ──────────────────────────────────────────────────────────────────
      - name: Restore market_tracker.db from private data repo (release asset)
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_PAT }}
        run: |
          mkdir -p market data
          # Try db-latest first; if it is missing (a failed --clobber upload deletes it
          # before the new copy lands), fall back to the newest dated backup. Starting
          # from an empty DB is NEVER automatic: on 2026-09-18 this step treated a
          # missing db-latest as "first run", began from scratch, and the upload step
          # then overwrote ~6 months of history for ~1,000 homes with 368 new ones.
          RESTORED=""
          if gh release download db-latest -R loganmount1/str-tracker-data -p 'market_tracker.db.gz' -D /tmp 2>/dev/null; then
            RESTORED="db-latest"
          else
            echo "::warning::db-latest missing; falling back to newest db-backups snapshot."
            NEWEST=$(gh release view db-backups -R loganmount1/str-tracker-data --json assets \
              --jq '.assets | map(.name) | sort | reverse | .[0] // empty' 2>/dev/null || true)
            if [ -n "$NEWEST" ] && gh release download db-backups -R loganmount1/str-tracker-data -p "$NEWEST" -D /tmp; then
              mv "/tmp/$NEWEST" /tmp/market_tracker.db.gz
              RESTORED="db-backups/$NEWEST"
            fi
          fi
          if [ -n "$RESTORED" ]; then
            echo "Restoring from $RESTORED"
            # Remember the size we started from; the save step refuses to upload a
            # DB that has shrunk sharply (the signature of a wipe).
            echo "RESTORED_GZ_BYTES=$(stat -c %s /tmp/market_tracker.db.gz)" >> "$GITHUB_ENV"
            gunzip -f /tmp/market_tracker.db.gz
            mv /tmp/market_tracker.db market/market_tracker.db
            echo "Restored DB: $(du -h market/market_tracker.db | cut -f1)"
            # GUARD: refuse to build on a corrupt DB. Exiting non-zero here means
            # the job fails BEFORE the upload step, so the good release asset is
            # never overwritten by a bad run. (This is exactly the failure mode
            # that silently destroyed the backup on 2026-06-25.) Use the FULL
            # integrity_check, not quick_check — on 2026-06-28 a corrupt DB slipped
            # past quick_check and got uploaded; the fuller check catches it.
            python -c "import sqlite3,sys; r=sqlite3.connect('market/market_tracker.db').execute('PRAGMA integrity_check').fetchone()[0]; print('Restored DB integrity:', r); sys.exit(0 if r=='ok' else 1)"
          elif [ "${{ github.event.inputs.allow_fresh_start }}" = "true" ]; then
            echo "::warning::No saved DB found; starting fresh because allow_fresh_start was set."
            echo "RESTORED_GZ_BYTES=0" >> "$GITHUB_ENV"
          else
            echo "::error::No saved DB could be restored (db-latest and db-backups both unavailable)."
            echo "::error::Refusing to start from an empty DB. Re-run manually with allow_fresh_start only if that is truly intended."
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────
      # Decide whether this run includes discovery.
      # Discovery runs on the weekly Monday cron, or when manually forced.
      # ──────────────────────────────────────────────────────────────────
      - name: Determine run mode
        id: mode
        run: |
          DISCOVER="false"
          # Weekly discovery cron
          if [ "${{ github.event.schedule }}" = "23 16 * * 1" ]; then
            DISCOVER="true"
          fi
          # Manual override
          if [ "${{ github.event.inputs.run_discovery }}" = "true" ]; then
            DISCOVER="true"
          fi
          echo "discover=$DISCOVER" >> "$GITHUB_OUTPUT"
          echo "Discovery this run: $DISCOVER"

      # ── Discovery (weekly only) ──
      - name: Discovery - search Airbnb for Mt Hood listings
        if: steps.mode.outputs.discover == 'true'
        run: |
          # collect_market_data.py writes market snapshots into data/tracker.db,
          # so make sure that dir exists. init_db seeds market/market_tracker.db
          # from those discovered listings on first run; sync_new_listings adds
          # any newly discovered listings on subsequent runs.
          mkdir -p data
          python collect_market_data.py
          if [ ! -f market/market_tracker.db ]; then
            python market/init_db.py
          fi
          python market/sync_new_listings.py
        continue-on-error: true
        timeout-minutes: 30

      # ── Collection (every run) ──
      - name: Collect calendars, details, reviews, pricing
        run: python market/collect_all.py --workers 4
        continue-on-error: true
        timeout-minutes: 180

      - name: Retry today's failures
        run: python market/collect_all.py --retry
        continue-on-error: true
        timeout-minutes: 60

      # ── Vacasa (every run) ──
      # Vacasa left Airbnb in Mar 2026, so their ~76 Mt Hood homes are scraped from
      # vacasa.com directly. Ported from the retired Mac pipeline 2026-09-08. The
      # --max-minutes budget is the fix for what killed that pipeline: this phase
      # used to wedge for 25+ hours on connection-reset storms and silently eat the
      # next day's run. Now it stops cleanly and the leftovers wait for tomorrow.
      - name: Collect Vacasa calendars + pricing (direct scrape)
        run: python market/collect_vacasa.py --max-minutes 110
        continue-on-error: true
        timeout-minutes: 120

      - name: Finalize - compute metrics + housekeeping
        run: python market/collect_all.py --finalize
        continue-on-error: true
        timeout-minutes: 20

      # ──────────────────────────────────────────────────────────────────
      # Save the updated database back to the PRIVATE data repo as a release
      # asset (gzipped). --clobber overwrites the previous day's asset.
      # ──────────────────────────────────────────────────────────────────
      - name: Save updated market_tracker.db to private data repo (release asset)
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_PAT }}
        run: |
          # Checkpoint the WAL so the .db file is self-contained before compressing.
          python -c "import sqlite3; db=sqlite3.connect('market/market_tracker.db'); db.execute('PRAGMA wal_checkpoint(TRUNCATE)'); db.close()"
          gzip -c market/market_tracker.db > market_tracker.db.gz
          echo "Compressed DB: $(du -h market_tracker.db.gz | cut -f1)"
          # GUARD: verify the EXACT artifact we are about to upload. Decompress the
          # gzip to a temp file and run a FULL integrity_check on THAT. This catches
          # corruption introduced anywhere — collection, WAL checkpoint, or gzip —
          # whereas an in-place check of the live DB does not: on 2026-06-28 the
          # corruption passed an in-place quick_check but the uploaded bytes were
          # still bad, which silently corrupted db-latest. Exit non-zero on failure
          # so the job goes red and the previous good db-latest is preserved.
          gunzip -kc market_tracker.db.gz > /tmp/_verify_upload.db
          python -c "import sqlite3,sys; r=sqlite3.connect('/tmp/_verify_upload.db').execute('PRAGMA integrity_check').fetchone()[0]; print('Upload-artifact integrity:', r); sys.exit(0 if r=='ok' else 1)"
          rm -f /tmp/_verify_upload.db
          # GUARD: refuse to upload a DB that shrank sharply versus what we restored.
          # Normal days only grow; a big drop means the history went missing. On
          # 2026-09-18 a fresh ~1 MB DB replaced a ~1 GB one and nothing stopped it.
          NEW_BYTES=$(stat -c %s market_tracker.db.gz)
          echo "Restored ${RESTORED_GZ_BYTES:-0} bytes gz -> saving ${NEW_BYTES} bytes gz"
          if [ "${RESTORED_GZ_BYTES:-0}" -gt 0 ] && [ "$NEW_BYTES" -lt $(( RESTORED_GZ_BYTES * 8 / 10 )) ]; then
            echo "::error::New DB is under 80% of the restored size. Not uploading; the saved copies are untouched."
            exit 1
          fi

          # ── Rolling backup: keep the last 7 daily snapshots ──
          # Uploaded BEFORE db-latest: `--clobber` deletes the old db-latest before the
          # new one finishes, so if that upload dies there must already be a fresh
          # dated copy for the next run's restore fallback to pick up.
          # db-latest is a single overwriting pointer, so a bad copy can wipe the
          # only backup. Also store a DATED snapshot in a separate `db-backups`
          # release and prune to the 7 newest, so there is always a known-good
          # fallback to roll back to. (Integrity was already verified above, so
          # every snapshot stored here is good.)
          DATE_TAG="$(date -u +%Y-%m-%d)"
          gh release create db-backups -R loganmount1/str-tracker-data \
            -t "DB rolling backups (last 7 days)" -n "Dated market_tracker.db snapshots; pruned to 7 newest." 2>/dev/null || true
          # The asset NAME must be the dated filename (gh names assets after the
          # local file; the `file#label` syntax only sets a display label, not the
          # name), so copy to a dated filename before uploading.
          cp market_tracker.db.gz "market_tracker_${DATE_TAG}.db.gz"
          gh release upload db-backups "market_tracker_${DATE_TAG}.db.gz" -R loganmount1/str-tracker-data --clobber
          echo "Stored dated backup market_tracker_${DATE_TAG}.db.gz"
          # Prune: asset names are YYYY-MM-DD so they sort chronologically. Keep
          # the 7 newest, delete the rest.
          gh release view db-backups -R loganmount1/str-tracker-data --json assets \
            --jq '.assets | map(.name) | sort | reverse | .[7:] | .[]' | while read -r OLD; do
              [ -n "$OLD" ] && gh release delete-asset db-backups "$OLD" -R loganmount1/str-tracker-data --yes && echo "Pruned old backup: $OLD"
            done

          # Now replace db-latest (the dated backup above is the safety net if this fails).
          gh release create db-latest -R loganmount1/str-tracker-data \
            -t "Market DB (latest)" -n "Rolling market_tracker.db snapshot" 2>/dev/null || true
          gh release upload db-latest market_tracker.db.gz -R loganmount1/str-tracker-data --clobber
          echo "Uploaded market_tracker.db.gz to db-latest release."

      # ──────────────────────────────────────────────────────────────────
      # Publish the market dashboard to GitHub Pages (replaces the Mac refresh).
      # The DB is already on the runner here, so no 580MB download and no Vercel
      # upload over a home connection — the two things that kept the old site
      # refresh failing. Build failures are non-fatal (data is already saved above).
      # ──────────────────────────────────────────────────────────────────
      - name: Build market dashboard site (_site/)
        env:
          PYTHON: python
        run: bash build_market_site.sh
        continue-on-error: true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: pages_deploy
        uses: actions/deploy-pages@v4

      # ──────────────────────────────────────────────────────────────────
      # OPTIONAL: sync aggregated market data to Supabase.
      # Disabled by default. Uncomment and provide a sync script if you want
      # the scraped market data pushed to a Supabase project.
      # TODO: add your own sync_market_to_supabase.py (NOT included in this
      #       public repo) before enabling this step.
      # ──────────────────────────────────────────────────────────────────
      # - name: Sync market data to Supabase
      #   env:
      #     SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      #     SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      #   run: python sync_market_to_supabase.py
      #   continue-on-error: true
